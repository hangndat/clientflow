name: Integration release gate

# Non-skippable RLS/auth integration against an isolated Supabase stack.
# Secretless CI stays in ci.yml. This gate must pass before release tags.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    types: [labeled]
  # Also run when explicitly requested on main pushes via repository_dispatch
  repository_dispatch:
    types: [integration-release]

jobs:
  rls-integration:
    if: >
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-integration')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start isolated local Supabase
        run: npx supabase start

      - name: Export local Supabase credentials
        run: |
          API_URL=$(npx supabase status -o env | sed -n 's/^API_URL=//p' | tr -d '"')
          ANON_KEY=$(npx supabase status -o env | sed -n 's/^ANON_KEY=//p' | tr -d '"')
          SERVICE_ROLE_KEY=$(npx supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY=//p' | tr -d '"')
          echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "INTEGRATION_REQUIRED=1" >> "$GITHUB_ENV"

      - name: Verify organizations INSERT policies (pg_policies)
        run: |
          DB_URL=$(npx supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/verify-org-insert-policies.sql
          INSERT_COUNT=$(psql "$DB_URL" -tAc "select count(*) from pg_policies where schemaname='public' and tablename in ('organizations','organization_members') and cmd='INSERT';")
          echo "INSERT policy count=$INSERT_COUNT"
          test "$INSERT_COUNT" = "0"

      - name: Credentialed RLS integration (non-skippable)
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          set -euo pipefail
          # Vitest exit code is the source of truth; also reject any skipped cases.
          OUTPUT=$(npm run test:integration:required 2>&1 | tee /dev/stderr)
          PLAIN=$(printf '%s' "$OUTPUT" | sed 's/\x1b\[[0-9;]*m//g')
          echo "$PLAIN" | grep -Eq 'Tests[[:space:]]+[1-9][0-9]* passed'
          if echo "$PLAIN" | grep -Eq 'Tests[[:space:]]+[0-9]+ passed \| [1-9][0-9]* skipped'; then
            echo "Integration release gate must not skip tests"
            exit 1
          fi
          if echo "$PLAIN" | grep -Eq '[1-9][0-9]* skipped'; then
            echo "Integration release gate must not skip tests"
            exit 1
          fi

      - name: Playwright smoke + auth callback E2E
        env:
          # Keep host identical to NEXT_PUBLIC_SITE_URL so callback cookies stick.
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: |
          npx playwright install --with-deps chromium
          npm run build
          npm run start -- --port 3000 &
          APP_PID=$!
          trap 'kill $APP_PID' EXIT
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/login >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:3000/login >/dev/null
          npm run test:e2e

      - name: Stop Supabase
        if: always()
        run: npx supabase stop

